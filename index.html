<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="เว็บไซต์ของ HOKADIW — Independent App Developer">
  <title>HOKADIW | Independent App Developer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #263b80, #0a1024 55%, #050812);
      color: #f7f8ff;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      padding: 48px 32px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(117,145,255,.18);
      border: 1px solid rgba(151,171,255,.35);
      font-size: .9rem;
    }
    h1 { margin: 20px 0 12px; font-size: clamp(2.5rem, 9vw, 5.5rem); line-height: .95; }
    p { color: #cbd3f5; font-size: 1.1rem; line-height: 1.75; }
    .stack { margin-top: 24px; color: #9eade8; font-size: .95rem; }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 20px;
      color: #081126;
      background: #f4f6ff;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <main>
    <span class="badge">เว็บไซต์ GitHub Pages พร้อมใช้งาน</span>
    <h1>HOKADIW</h1>
    <p>นักพัฒนาแอปอิสระ สนใจ Android, Linux, AI, Automation และการสร้างเทคโนโลยีที่นำไปใช้ได้จริง</p>
    <div class="stack">Android · Ubuntu · Docker · VPN · AI · Reverse Engineering</div>
    <a href="https://github.com/l2acha">ดูโปรเจกต์บน GitHub</a>
  </main>
</body>
</html>
